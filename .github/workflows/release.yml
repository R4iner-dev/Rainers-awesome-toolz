name: Package Godot Addon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create addon package
        run: |
          mkdir -p package
          cp -r "addons/rainers_awesome_toolz" "package/rainers_awesome_toolz"

          cd package
          zip -r "../rainers_awesome_toolz.zip" "rainers_awesome_toolz"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "rainers_awesome_toolz.zip" \
            --title "Rainers awesome toolz ${{ github.ref_name }}" \
            --generate-notes